<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="MesterKalk – több mint 150 praktikus szakmai és otthoni kalkulátor">
<meta name="theme-color" content="#1677ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MesterKalk">
<title>MesterKalk – 150+ kalkulátor</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header>
<button id="homeBtn" class="brand" type="button">🧮 MesterKalk</button>
<div class="tag">Praktikus számolás egyszerűen</div>
<button id="installBtn" class="install-btn hidden" type="button">📲 Telepítés</button>
</header>

<main id="app">
<section id="home" class="screen active">
  <div class="hero">
    <div class="eyebrow">GYORS • PONTOS • EGYSZERŰ</div>
    <h1>Mit szeretnél kiszámolni?</h1>
    <p>Válassz kategóriát, vagy keress rá közvetlenül a több mint 150 szakmai és otthoni számoló egyikére.</p>
  </div>
  <div class="search"><input id="search" type="search" placeholder="🔎 Keresés: beton, csempe, kábel, festék, tető..."></div>
  <div id="categories" class="grid categories"></div>
  <div id="searchResults" class="grid calc-grid hidden"></div>
</section>

<section id="category" class="screen">
  <button id="backCategory" class="back" type="button">← Kategóriák</button>
  <div id="categoryHeader"></div>
  <div id="calculators" class="grid calc-grid"></div>
</section>

<section id="calculator" class="screen">
  <button id="backCalc" class="back" type="button">← Vissza</button>
  <div id="calcHeader"></div>
  <div class="calc-layout">
    <form id="calcForm" class="card"><div id="fields"></div><button class="primary" type="submit">🧮 Számolás</button></form>
    <aside id="result" class="result card hidden">
      <div class="result-label">EREDMÉNY</div>
      <div id="resultMain" class="result-main">—</div>
      <div id="resultDetails" class="result-details"></div>
      <button id="again" class="secondary" type="button">Új számítás</button>
    </aside>
  </div>
</section>
</main>
<footer>MesterKalk • helyben számoló alkalmazás • 150+ kalkulátor</footer>

<script src="./js/app.js"></script>
</body>
</html>
